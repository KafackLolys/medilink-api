name: MediLink API notification delivery validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/notifications/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/push-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fcm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --runInBand src/notifications/notifications.service.spec.ts
